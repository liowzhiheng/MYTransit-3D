<div class="map-viewport">
  <!-- MapLibre GL Canvas Container -->
  <div #mapContainer class="map-canvas-container"></div>

  <!-- Loading Overlay -->
  <div *ngIf="!(isMapLoaded$ | async)" class="map-loading-overlay">
    <div class="loader-content">
      <div class="cyber-spinner"></div>
      <div class="loader-title font-mono">INITIALIZING URBAN DIGITAL TWIN</div>
      <div class="loader-sub font-mono">Loading OpenFreeMap Dark Vector Tiles & 3D Building Extrusions...</div>
    </div>
  </div>

  <!-- Map Error Banner -->
  <div *ngIf="mapError$ | async as err" class="map-error-banner font-mono">
    <span class="error-badge">WARN</span>
    <span>{{ err }}</span>
  </div>

  <!-- HUD Control Floating Panel -->
  <div class="map-hud-controls" [class.offset-panel]="isRightPanelOpen">
    <button
      class="hud-btn"
      [class.active]="is3D$ | async"
      (click)="toggle3D()"
      title="Toggle 3D Building Perspective"
    >
      <span class="hud-icon font-mono font-bold">{{ (is3D$ | async) ? '3D' : '2D' }}</span>
      <span class="hud-tooltip font-mono">3D Extrusion</span>
    </button>

    <button class="hud-btn" (click)="resetBearing()" title="Reset Compass & North-Up Bearing">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="12 2 19 21 12 17 5 21 12 2"></polygon>
      </svg>
      <span class="hud-tooltip font-mono">Align North</span>
    </button>

    <button class="hud-btn" (click)="resetView()" title="Recenter Kuala Lumpur Central">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
      <span class="hud-tooltip font-mono">Recenter KL</span>
    </button>

    <div class="hud-divider"></div>

    <button class="hud-btn" (click)="zoomIn()" title="Zoom In">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span class="hud-tooltip font-mono">Zoom In</span>
    </button>

    <button class="hud-btn" (click)="zoomOut()" title="Zoom Out">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span class="hud-tooltip font-mono">Zoom Out</span>
    </button>

    <button class="hud-btn" (click)="toggleFullscreen()" title="Fullscreen Mode">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 3 21 3 21 9"></polyline>
        <polyline points="9 21 3 21 3 15"></polyline>
        <line x1="21" y1="3" x2="14" y2="10"></line>
        <line x1="3" y1="21" x2="10" y2="14"></line>
      </svg>
      <span class="hud-tooltip font-mono">Fullscreen</span>
    </button>
  </div>
</div>
