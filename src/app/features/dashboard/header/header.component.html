<header class="apple-header">
  <div class="header-left">
    <button class="nav-control-btn" (click)="toggleLeftPanel.emit()" title="Toggle Network Directory" aria-label="Toggle Network Directory">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="6" x2="20" y2="6"></line>
        <line x1="4" y1="12" x2="20" y2="12"></line>
        <line x1="4" y1="18" x2="20" y2="18"></line>
      </svg>
    </button>

    <div class="brand-group">
      <div class="brand-name-row">
        <span class="status-indicator-dot" title="Network Connected"></span>
        <h1 class="brand-title">MYTransit <span class="brand-accent">3D</span></h1>
      </div>
      <span class="brand-subtext">Klang Valley Spatial Transit Twin</span>
    </div>
  </div>

  <div class="header-right">
    <button class="source-pill-btn" (click)="openDataSources.emit()" title="View Open Data Architecture & Specifications">
      <span class="source-label">Data Sources</span>
      <span class="source-badge">Open Data</span>
    </button>

    <div class="header-divider"></div>

    <div class="clock-block font-mono">
      <div class="clock-time">{{ currentTime() }} <span class="clock-tz">MYT</span></div>
      <div class="clock-date">{{ currentDate() }}</div>
    </div>
  </div>
</header>
