<footer class="apple-status-dock">
  <div class="status-capsule">
    <div class="status-metric">
      <span class="metric-num">{{ stats?.activeLines || '10' }}</span>
      <span class="metric-lbl">Lines</span>
    </div>

    <span class="capsule-divider"></span>

    <div class="status-metric">
      <span class="metric-num">{{ stats?.totalStations || '191' }}</span>
      <span class="metric-lbl">Stations</span>
    </div>

    <span class="capsule-divider"></span>

    <div class="status-metric">
      <span class="metric-num font-mono">
        <span *ngIf="vehiclesCount !== null && vehiclesCount > 0; else dashVehicles">{{ vehiclesCount }}</span>
        <ng-template #dashVehicles>--</ng-template>
      </span>
      <span class="metric-lbl">{{ isRealtime ? 'Live GPS' : 'Active Trains' }}</span>
    </div>

    <span class="capsule-divider"></span>

    <div class="status-indicator-group">
      <span class="status-dot-pulse"></span>
      <span class="status-text">{{ stats?.networkStatus || 'Operational' }}</span>
    </div>

    <span class="capsule-divider"></span>

    <span class="provenance-tag">data.gov.my</span>
  </div>
</footer>
