<aside class="apple-sidebar" [class.panel-collapsed]="!isOpen">
  <div class="sidebar-header">
    <div class="sidebar-title-row">
      <div class="header-text-group">
        <h2 class="sidebar-title">Network Directory</h2>
        <span class="sidebar-subtitle">Klang Valley Transit Corridors</span>
      </div>
      <button class="panel-close-btn" (click)="closePanel.emit()" title="Hide Sidebar" aria-label="Hide Sidebar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="sidebar-scrollable">
    <!-- Spotlight Search Bar -->
    <div class="search-section">
      <app-station-search (stationSelected)="onStationSelected($event)"></app-station-search>
    </div>

    <!-- Mode Filter Segmented Control -->
    <div class="filter-section" *ngIf="modeCounts$ | async as counts">
      <div class="section-label">Transit Modes</div>
      <div class="segmented-control">
        <button
          class="segment-pill"
          [class.active]="(activeMode$ | async) === 'ALL'"
          (click)="setModeFilter('ALL')"
        >
          <span>All</span>
          <span class="pill-count">{{ counts.ALL }}</span>
        </button>

        <button
          class="segment-pill"
          [class.active]="(activeMode$ | async) === 'MRT'"
          (click)="setModeFilter('MRT')"
        >
          <span>MRT</span>
          <span class="pill-count">{{ counts.MRT }}</span>
        </button>

        <button
          class="segment-pill"
          [class.active]="(activeMode$ | async) === 'LRT'"
          (click)="setModeFilter('LRT')"
        >
          <span>LRT</span>
          <span class="pill-count">{{ counts.LRT }}</span>
        </button>

        <button
          class="segment-pill"
          [class.active]="(activeMode$ | async) === 'MONORAIL'"
          (click)="setModeFilter('MONORAIL')"
        >
          <span>Monorail</span>
          <span class="pill-count">{{ counts.MONORAIL }}</span>
        </button>

        <button
          class="segment-pill"
          [class.active]="(activeMode$ | async) === 'KTM'"
          (click)="setModeFilter('KTM')"
        >
          <span>KTM</span>
          <span class="pill-count">{{ counts.KTM }}</span>
        </button>

        <button
          class="segment-pill"
          [class.active]="(activeMode$ | async) === 'BUS'"
          (click)="setModeFilter('BUS')"
        >
          <span>Bus</span>
          <span class="pill-count">{{ counts.BUS }}</span>
        </button>
      </div>
    </div>

    <!-- Transit Corridors Flat List -->
    <div class="lines-section" *ngIf="filteredRoutes$ | async as routes">
      <div class="lines-header-row">
        <span class="section-label">Corridors ({{ routes.length }})</span>
        <button *ngIf="activeLineId$ | async" class="reset-pill-btn" (click)="clearLineFilter()" title="Clear corridor filter">
          Reset Filter
        </button>
      </div>

      <!-- Active Corridor Isolation Indicator -->
      <div *ngIf="selectedRoute$ | async as selectedRoute" class="active-isolation-card">
        <div class="isolation-top">
          <span class="isolation-badge" [style.background-color]="selectedRoute.color">Isolated</span>
          <span class="isolation-name">{{ selectedRoute.name }}</span>
        </div>
        <p class="isolation-desc" *ngIf="selectedRoute.description">
          {{ selectedRoute.description }}
        </p>
      </div>

      <div class="lines-flat-list">
        <div
          *ngFor="let line of routes"
          class="line-row-item"
          [class.line-selected]="(activeLineId$ | async) === line.id"
          (click)="toggleLineFilter(line.id)"
          title="Filter map to {{ line.name }}"
        >
          <div class="line-row-left">
            <span class="line-stripe" [style.background-color]="line.color"></span>
            <span class="line-code-tag font-mono" [style.background-color]="line.color" [style.color]="line.textColor || '#fff'">
              {{ line.shortName || line.id }}
            </span>
            <span class="line-name-text">{{ line.name }}</span>
          </div>
          <div class="line-row-right">
            <span class="line-mode-badge">{{ line.mode }}</span>
            <span class="line-operational-dot" title="Operational"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</aside>
