<div class="operations-center-root">
  <!-- Offline Air-Gapped Network Indicator Banner -->
  <div *ngIf="!(transitData.isOnline$ | async)" class="offline-banner font-mono" role="alert">
    <span class="pulse-dot alert-dot"></span>
    <span>AIR-GAPPED / OFFLINE MODE — RUNNING FROM CACHED TRANSIT GEOMETRIES</span>
  </div>

  <!-- Operations Center Top Nav -->
  <app-header
    (toggleLeftPanel)="toggleLeftPanel()"
    (toggleRightPanel)="toggleRightPanel()"
    (openDataSources)="isDataSourceModalOpen.set(true)"
  ></app-header>

  <!-- Interactive Digital Twin Spatial Surface -->
  <main class="spatial-surface">
    <!-- Mobile Drawer Dimmer Backdrop (Tapping closes open sidebars on mobile) -->
    <div
      class="mobile-drawer-backdrop"
      [class.active]="isLeftPanelOpen() || isRightPanelOpen()"
      (click)="onBackdropClick()"
      aria-label="Dismiss sidebar overlay"
    ></div>
    <!-- Left Drawer: Network Directory & Mode Filters -->
    <app-network-panel
      [isOpen]="isLeftPanelOpen()"
      (closePanel)="toggleLeftPanel()"
      (stationSelected)="onStationSelected($event)"
    ></app-network-panel>

    <!-- Center 3D Map Viewport -->
    <app-transit-map></app-transit-map>

    <!-- Right Drawer: Station & Telemetry Inspector -->
    <app-station-panel
      [isOpen]="isRightPanelOpen()"
      [station]="selectedStation$ | async"
      (closePanel)="toggleRightPanel()"
    ></app-station-panel>

    <!-- Mobile Quick HUD Floating Strip -->
    <div class="mobile-hud-dock">
      <button
        class="mobile-dock-btn"
        [class.active]="isLeftPanelOpen()"
        (click)="toggleLeftPanel()"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
        <span>NETWORK</span>
      </button>

      <button
        class="mobile-dock-btn"
        [class.active]="isRightPanelOpen()"
        (click)="toggleRightPanel()"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>STATION</span>
      </button>
    </div>
  </main>

  <!-- Global Telemetry & Status Bottom Bar -->
  <app-network-stats
    [stats]="networkStats$ | async"
    [cameraState]="cameraState$ | async"
    [is3D]="(is3D$ | async) ?? true"
    [vehiclesCount]="vehiclesCount$ | async"
    [isRealtime]="(isRealtimeConnected$ | async) ?? false"
  ></app-network-stats>

  <!-- Data Source Provenance & Architecture Modal -->
  <app-data-source-modal
    [isOpen]="isDataSourceModalOpen()"
    (closeModal)="isDataSourceModalOpen.set(false)"
  ></app-data-source-modal>
</div>
